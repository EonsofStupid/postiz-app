name: fuqn base image

# Validates the fork-owned base image. Publishing is separate and can only
# push ghcr.io/eonsofstupid/postiz-app. This workflow does not log in to a
# registry during validation and does not write to ghcr.io/gitroomhq.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'fuqn-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Type publish to push ghcr.io/eonsofstupid/postiz-app. Any other value only builds and smoke-tests.'
        required: true
        default: build-only
        type: string
      tag_latest:
        description: 'Type latest to also push the latest tag. Leave empty otherwise.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: fuqn-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Build image and smoke-test the stack
        run: bash deploy/fuqn/smoke-test.sh

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuqn-smoke-report
          path: /tmp/fuqn-smoke-report
          if-no-files-found: ignore

  publish:
    name: publish image
    needs: validate
    if: >-
      github.repository == 'EonsofStupid/postiz-app' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.publish == 'publish') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fuqn-v'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io/eonsofstupid/postiz-app
        env:
          FUQN_PUBLISH: "1"
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: bash deploy/fuqn/publish-image.sh
