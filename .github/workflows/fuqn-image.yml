name: fuqn base image

# Builds and checks linux/amd64 and linux/arm64. Publishing is a separate
# job and can only push ghcr.io/eonsofstupid/postiz-app. Validation does not
# log in to a registry and does not write to ghcr.io/gitroomhq.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'fuqn-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Type publish to push ghcr.io/eonsofstupid/postiz-app. Any other value only builds and checks.'
        required: true
        default: build-only
        type: string
      tag_latest:
        description: 'Type latest to also push the latest tag. Leave empty otherwise.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: fuqn-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            smoke: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Trivy
        run: |
          curl -fsSL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            curl -fsSL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-ARM64.tar.gz"
          fi
          tar -C /tmp -xzf /tmp/trivy.tgz trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy

      - name: Build, scan, and smoke-test
        run: |
          version="$(tr -d '[:space:]' < deploy/fuqn/VERSION)"
          upstream="$(tr -d '[:space:]' < version.txt)"
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=12 HEAD)"
          image="ghcr.io/eonsofstupid/postiz-app:${version}-${{ matrix.arch }}"
          docker build --platform "linux/${{ matrix.arch }}" --file Dockerfile \
            --build-arg "FUQN_VERSION=${version}" \
            --build-arg "UPSTREAM_RELEASE=v2.25.3" \
            --build-arg "UPSTREAM_VERSION_FILE=${upstream}" \
            --build-arg "GIT_SHA=${sha}" \
            --build-arg "NEXT_PUBLIC_VERSION=fuqn-base-${version}" \
            --tag "${image}" \
            --tag "ghcr.io/eonsofstupid/postiz-app:sha-${short}-${{ matrix.arch }}" \
            .
          arch="$(docker run --rm --entrypoint node "${image}" -p process.arch)"
          # Node reports amd64 as x64.
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            test "${arch}" = "x64"
          else
            test "${arch}" = "arm64"
          fi
          trivy image --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile deploy/fuqn/.trivyignore \
            --format cyclonedx --output "/tmp/fuqn-sbom-${{ matrix.arch }}.cdx.json" \
            "${image}"
          if [ "${{ matrix.smoke }}" = "true" ]; then
            docker tag "${image}" "ghcr.io/eonsofstupid/postiz-app:${version}"
            FUQN_SKIP_BUILD=1 bash deploy/fuqn/smoke-test.sh
          fi

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuqn-sbom-${{ matrix.arch }}
          path: /tmp/fuqn-sbom-${{ matrix.arch }}.cdx.json
          if-no-files-found: ignore

      - name: Upload smoke report
        if: always() && matrix.smoke
        uses: actions/upload-artifact@v4
        with:
          name: fuqn-smoke-report
          path: /tmp/fuqn-smoke-report
          if-no-files-found: ignore

  publish:
    name: publish image
    needs: image
    if: >-
      github.repository == 'EonsofStupid/postiz-app' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.publish == 'publish') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fuqn-v'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and sign ghcr.io/eonsofstupid/postiz-app
        env:
          FUQN_PUBLISH: "1"
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: bash deploy/fuqn/publish-image.sh
